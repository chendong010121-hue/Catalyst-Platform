# Type-check the ontology and wiki core.
#
# The platform is not annotated end to end and this file does not pretend it is: the five
# modules below are the ones an ontology decision has to pass through, and they are checked
# as they are. Imported modules are read for signatures and not re-checked, so the result is
# about these files alone and stays fast enough to run on every push.
[mypy]
python_version = 3.12
files = catalyst_platform/ontology_types.py, catalyst_platform/ontology_concepts.py, catalyst_platform/semantic_score.py, catalyst_platform/wiki.py, catalyst_platform/wiki_pages.py, catalyst_platform/wiki_cold_read.py
ignore_missing_imports = True
follow_imports = skip
check_untyped_defs = True
