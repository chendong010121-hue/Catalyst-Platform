infrastructure_scope:
  I_01_preflight:
    required: true
    result_states:
      - READY
      - BLOCKED
    minimum_block_reasons:
      - CREDENTIAL_UNAVAILABLE
      - WORKSPACE_INVALID
      - EXECUTABLE_UNAVAILABLE
      - POLICY_INVALID
      - PROVIDER_BINDING_INVALID
    model_call_during_preflight: FORBIDDEN

  I_02_credentials:
    required_sources:
      - PROCESS_ENVIRONMENT
      - USER_LOCAL
    credential_ref_required: true
    literal_secret_in_task_or_binding: FORBIDDEN
    recommended_ref: deepseek.default
    user_local_store:
      default_outside_repo: true
      test_path_override: REQUIRED
      credential_value_logging: FORBIDDEN
      credential_value_trace: FORBIDDEN
      credential_value_results: FORBIDDEN
      credential_value_model_context: FORBIDDEN
      best_effort_owner_only_permissions: REQUIRED
      human_hidden_input_setup: REQUIRED
      model_callable_setup_tool: FORBIDDEN
    security_claim_limit: >-
      The proof covers credential resolution, redaction, non-model exposure and
      non-inheritance into tool subprocess ENVIRONMENT. It does not prove that
      arbitrary same-user code cannot read the local credential file.

  I_03_tool_environment:
    explicit_subprocess_env_required: true
    implicit_parent_env_inheritance: FORBIDDEN
    positive_allowlist_direction: REQUIRED
    deepseek_api_key_in_tool_env: FORBIDDEN
    representative_synthetic_secret_in_tool_env: FORBIDDEN
    filesystem_isolation_claim: FORBIDDEN

  I_04_policy_split:
    ExecutionPolicy_owns:
      - allowed_reads
      - allowed_writes
      - allowed_stage_declared_commands
      - command_timeout
      - model_attempt_budget
      - repair_cycle_budget
      - explicit_non_secret_task_env
    ApprovalPolicy_owns:
      - allow_or_deny_already_policy_permitted_action
    approval_can_widen_execution_policy: false
    network_tool_exposed: false
    os_network_isolation_claim: false

  I_05_identity:
    minimum_fields:
      - harness_implementation_version
      - harness_source_revision_or_unknown
      - python_version
      - os_name
      - os_release_or_platform_family
      - architecture
      - workspace_root
      - provider_id
      - model_id
      - credential_source_type
      - execution_policy_identity
      - preflight_status
    full_environment_dump: FORBIDDEN
    credential_store_path_or_content_in_results: FORBIDDEN

fresh_process_proof:
  required_for_E03: true
  required_for_E09: true
  same_process_os_environ_mutation_only: INSUFFICIENT
  deepseek_api_key_explicitly_absent_from_fresh_process_env: REQUIRED

live_proof:
  required_for_final_pass: true
  provider: DeepSeekModelProvider
  credential_source_required: USER_LOCAL
  credential_ref: deepseek.default
  process_env_DEEPSEEK_API_KEY: MUST_BE_ABSENT
  preflight: READY_REQUIRED
  tool_subprocess_DEEPSEEK_API_KEY: MUST_BE_ABSENT
  provider_request_must_succeed: true
  deterministic_verification_must_pass: true
  max_model_attempts: 6
  max_repair_cycles: 1

credential_setup_rule:
  if_user_local_credential_missing: >-
    STOP implementation execution at the live-proof boundary and ask the human to
    run the Candidate's hidden-input credential setup entry point locally. Do not
    ask for the secret in chat, command arguments, files, or executor text.
  implementation_can_complete_before_live_setup: true
  final_pass_without_live_E09: false

required_outputs:
