  - run E-09 live DeepSeek proof through UserLocalCredentialSource
  - verify tool subprocess environment does not contain provider credential
  - write V0_2_RESULTS.json, V0_2_REVIEW.md and V0_2_FREEZE_RECORD.json
  - verify frozen V0.1 and all protected boundaries unchanged
  - create exactly one implementation_plus_evidence commit
  - push platform-harness
  - STOP

failure_and_stop_rules:
  - if a new dependency becomes necessary: STOP
  - if existing Runtime or frozen V0.1 must be modified: STOP
  - if a general shell or sandbox appears necessary: STOP
  - if E-09 exposes provider/Harness incompatibility: STOP; do not opportunistically expand scope
  - if any secret appears in trace/results/review/diff: STOP and sanitize generated evidence before commit without changing architecture scope
  - if any write outside authorized root appears necessary: STOP

commit_policy:
  implementation_plus_evidence_commits: 1
  suggested_message: "platform-harness: prove environment-complete harness candidate"
  push_required: true
  merge: FORBIDDEN
