credential_policy:
  required_environment_variable: DEEPSEEK_API_KEY
  user_must_not_commit_key: true
  key_persistence: FORBIDDEN
  key_logging: FORBIDDEN
  key_in_results: FORBIDDEN
  key_in_review: FORBIDDEN
  key_in_trace: FORBIDDEN

execution_sequence:
  - verify branch is platform-harness
  - verify HEAD equals this Authorization commit before evidence execution
  - verify working tree clean
  - verify DEEPSEEK_API_KEY exists in the executor process environment without printing its value
  - run existing deterministic test suite unchanged
  - run existing live_proof.py unchanged
  - run existing record_results.py unchanged with the same environment
  - verify V0_1_RESULTS.json records live_proof.status PASS and H-03 PASS
  - verify final verdict becomes MINIMUM_HARNESS_V0_1_PASS
  - verify only V0_1_RESULTS.json and V0_1_REVIEW.md changed after this Authorization
  - create exactly one evidence-repair commit
  - push platform-harness
  - STOP

stop_conditions:
  - DEEPSEEK_API_KEY is unavailable
  - live proof fails for any reason
  - provider/tool-call compatibility fails
  - deterministic tests regress
  - any Harness/fixture/test code change appears necessary
  - any write outside the two authorized evidence files appears necessary

failure_rule: >-
  If the live proof exposes any real implementation/provider compatibility defect,
  STOP and report the defect. Do not repair code under this authorization. A new
  targeted implementation-repair authorization would be required.

commit_policy:
  evidence_repair_commits: 1
  suggested_message: "platform-harness: close minimum harness v0.1 live proof"
  push_required: true
  merge: FORBIDDEN
  pull_request: FORBIDDEN

successful_final_state:
  h03: PASS
  verdict: MINIMUM_HARNESS_V0_1_PASS
  platform_integration: NOT_AUTHORIZED
  case01_trial: NOT_AUTHORIZED

explicitly_not_authorized:
