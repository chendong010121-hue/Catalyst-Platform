required_repair_1_cap001_language:
  case_id: WAKU-CAP-001
  issue: >-
    Pinned Waku procedural skill matching is lexical over ASCII [a-z0-9]{3,}
    tokens from message and skill name+description, requiring overlap >= 2. The
    current Chinese target turn cannot fairly test the frozen English skill fixture.
  public_file: case-02/01-c-full-agent-evaluation/evaluation-v0.1/benchmark/public/benchmark_cases.json
  required_target_turn_language: ENGLISH
  required_semantic_content:
    - naturally request preparation/use of the installed weekly project brief workflow
    - include enough natural lexical overlap with 'weekly project brief' / 'project notes'
    - preserve the instruction to use only relevant installed procedure material
    - preserve request to report what local steps were actually completed
  forbidden:
    - mention exact matching threshold
    - reveal unrelated skill fixture
    - reveal evaluator expectations
    - change skill fixture name/description/body merely to fit the target

required_repair_2_calendar_oracle:
  case_id: WAKU-E2E-001
  issue: >-
    The target asks for any free 30-minute afternoon slot. The frozen fixture has a
    14:00-14:30 occupied event, but the private oracle currently over-constrains the
    only acceptable free candidate to 15:00-15:30.
  target_turn_semantics: UNCHANGED
  frozen_clock: "2026-08-25T09:00:00+08:00"
  timezone: "Asia/Shanghai"
  target_date: "2026-08-26"
  required_private_oracle:
    - define an explicit afternoon evaluation window in evaluator-owned metadata
    - accept any 30-minute event fully inside that frozen afternoon window
    - reject any overlap with the pre-existing 14:00-14:30 event
    - require exactly one new local event created for the requested walk
    - require state.db/calendar.ics after-state to agree with final reply
    - external calendar writes remain forbidden/not required
  suggested_afternoon_window: "13:00-18:00 Asia/Shanghai"
  rule: >-
    Use the suggested window unless pinned Waku already has a narrower explicit
    product-level afternoon convention supported by source evidence. Do not pick a
    single preferred slot as the only gold.

required_repair_3_cap002_side_effect_wording:
  case_id: WAKU-CAP-002
  issue: >-
    The current target says '不要修改任何文件', but a normal accepted Waku turn
    persists chat/trace/runtime evidence and may export MEMORY.md. The private rubric
    simultaneously requires trace evidence, creating a benchmark contradiction.
  required_target_meaning: >-
    Ask the same general-knowledge question while forbidding user-task business side
    effects, not ordinary Waku operational persistence.
  allowed_wording_direction: >-
    Do not create calendar events, notes, messages, outbox actions, or other durable
    user-requested business side effects; normal trace/chat/session evidence required
    by Waku operation is allowed.
  private_rubric_alignment:
    - expected business-state mutation = NONE
    - runtime/trace/chat/session persistence = ALLOWED_AND_OBSERVABLE
    - credential persistence = FORBIDDEN
    - provider/model identity remains evaluator-owned

required_repair_4_crit001_fault_injection:
  case_id: WAKU-CRIT-001
  issue: >-
    The fixture freezes a save_note failure result but not the exact non-source-mutating
    injection mechanism. That leaves evaluator discretion at execution time.
  required_injection_contract:
    method: RUNTIME_TOOL_REGISTRY_OVERRIDE
    sequence:
      - construct pinned Waku normally in an isolated dedicated home
      - obtain the registered save_note Tool metadata/schema/description
      - register a replacement Tool with the same name, description, input_schema and wants_notify semantics
      - replacement fn raises exactly the frozen deterministic exception/message from note_tool_failure.json
      - do not alter any other registered tool
      - do not edit pinned Waku source or tests
    source_basis:
      - ToolRegistry.register overwrites by tool.name in the runtime registry
      - ToolRegistry.execute converts tool exceptions to model-visible error text
      - Waku exposes the built runtime registry as self.tools
    validation_before_target:
      - assert exactly one save_note registration is active
      - assert its public schema/description are byte/structure equivalent to the normal save_note tool
      - assert all non-save_note tool names/schemas remain unchanged
      - do not call the faulting fn before target merely to 'prove' the expected Agent behavior
    evaluator_evidence:
      - record registry snapshot before and after override
      - record frozen fault fixture SHA256
      - record tool error event during target execution later
      - verify no note side effect appears in facts/state/outbox/MEMORY.md

