required_repair_1_target_visible_surface:
  public_file: case-02/01-c-full-agent-evaluation/evaluation-v0.1/benchmark/public/benchmark_cases.json
  rule: >-
    Rewrite public benchmark content so it contains only target-visible user turn sequence
    and product-visible context. Evaluator setup, expected outcome, gates, state checks,
    trajectory constraints, partial credit, failure attribution, and internal asset/responsibility
    metadata must not be target-visible.
  allowed_target_visible_fields_per_case:
    - case_id
    - target_turns
  target_turns_contract: >-
    Each target_turn is exact user-visible text sent through the Waku product path in order.
    If a process restart/session switch occurs between turns, that operation is evaluator-owned
    and must live in private setup/execution metadata, not as hidden coaching text to the model.
  evaluator_only_fields_must_move_private:
    - suite
    - product_responsibilities_tested
    - related_asset_ids_if_any
    - setup_state
    - isolated_world_requirements
    - expected_observable_outcome
    - hidden_rubric_or_deterministic_checks
    - critical_gate_conditions
    - acceptable_partial_credit_if_any
    - forbidden_shortcuts
    - required_trace_or_state_evidence
    - trajectory_constraints_if_any
    - failure_attribution_hints
  requirement: >-
    The repaired public file is the exact target-visible prompt/turn projection. No undocumented
    runtime filter may be relied upon to hide evaluator metadata.

required_repair_2_executable_fixtures:
  private_fixture_root: case-02/01-c-full-agent-evaluation/evaluation-v0.1/benchmark/private/fixtures
  rule: >-
    Freeze concrete evaluator-owned initial-state and failure/setup fixtures needed by the seven
    Cases. Later execution may materialize them into a fresh temporary WAKU_HOME, but may not
    improvise benchmark-critical initial state after Waku execution starts.
  minimum_fixture_material:
    WAKU-E2E-001:
      - exact pre-existing local calendar event fixture with deterministic absolute date/time
      - timezone/clock assumption for the target turn
      - expected non-overlap rule and before-state identity
    WAKU-E2E-002:
      - explicit clean memory/session initial-state contract
      - restart boundary contract
    WAKU-E2E-003:
      - exact stale preference fixture using Waku-supported state semantics or a reproducible setup operation
      - restart boundary contract
    WAKU-E2E-004:
      - exact session identifiers/setup contract
      - explicit session switch/reload sequence owned by evaluator
    WAKU-CAP-001:
      - exact matching SKILL.md fixture
      - exact unrelated SKILL.md fixture
      - expected install/location contract
    WAKU-CRIT-001:
      - deterministic controlled note-tool failure injection contract
      - exact failure boundary and proof that only the target tool is affected
    WAKU-CAP-002:
      - clean no-side-effect home contract
      - ops-step contract for later native eval/release checks
  fixture_hash_rule: >-
    BENCHMARK_FREEZE_RECORD must list every benchmark-critical fixture path and SHA256.
  observability_rule: >-
    If a fixture or required assertion cannot be reliably materialized/observed against the pinned
    Waku without source modification, STOP and record the limitation instead of inventing fields.

required_repair_3_cap002_responsibility_separation:
  case: WAKU-CAP-002
  target_step: >-
    Replace current target-visible instruction with a normal bounded no-side-effect user knowledge turn.
    The user must not ask Waku to produce its own evaluation result, release gate report, provider identity,
    or benchmark trace.
  evaluator_ops_step_must_be_private:
    - inspect/reconstruct the live turn trace
    - record externally known provider/model identity
    - execute or inspect applicable native deterministic/judge/release-gate behavior only in later authorized execution
    - preserve native semantic rule that judge skipped is not PASS
    - confirm credentials are not persisted
  case_id_must_remain: WAKU-CAP-002
  case_count_must_remain: 7

required_repair_4_time_and_observability_precision:
  time_relative_cases:
    - WAKU-E2E-001
  rule: >-
    Freeze a deterministic evaluation clock/timezone in private fixture/setup metadata and either
    convert the target turn to an absolute product-natural date/time or explicitly guarantee the later
    runner supplies the frozen clock semantics. Avoid a benchmark whose expected calendar world drifts
    merely because execution happens on another day.
  trace_check_rule: >-
    Review desired trace/state checks against pinned Waku observability. Use only fields/events/artifacts
    that actually exist or can be externally verified without modifying Waku. If exact skill-match metadata,
    reload event, correlation id, or another desired signal is unavailable, replace it with the strongest
    valid external observable evidence and document the limitation.

