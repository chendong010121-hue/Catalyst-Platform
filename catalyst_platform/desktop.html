<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalyst 工作台</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;color:#17273a;background:#f4f7fa;margin:0;padding:2rem 1rem}
  main{max-width:46rem;margin:auto}h1{margin-bottom:.25rem}small{color:#495d70}
  form,article{padding:1rem;margin:1rem 0;background:white;border:1px solid #d4e0ea;border-radius:.5rem}
  textarea{box-sizing:border-box;width:100%;font:inherit;margin:.35rem 0;resize:vertical;padding:.5rem}
  button,select{font:inherit;padding:.25rem .6rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}
  .turn-message{white-space:pre-wrap;overflow-wrap:anywhere}
  .conversation-picker{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
  .conversation-picker select{min-width:10rem;max-width:100%}
</style>
<script src="/desktop.js" defer></script>
</head>
<body>
<main>
  <h1>Catalyst 工作台</h1>
  <p id="status" role="status">正在读取启动状态…</p>
  <small id="build"></small>
  <details id="connection" hidden>
    <summary>模型连接与本地工具</summary>
    <form id="connect">
      <label for="api-key">DeepSeek API Key</label>
      <input type="password" id="api-key" autocomplete="off" maxlength="512" required>
      <label><input type="checkbox" id="remember">记住 Key（Windows 加密）</label>
      <button type="submit">连接</button>
    </form>
    <button type="button" id="use-saved">使用已保存的 Key</button>
    <button type="button" id="disconnect">断开</button>
    <button type="button" id="forget-key">移除已保存的 Key</button>
    <p id="connection-limits"></p>
    <p id="tools"></p>
  </details>
  <div class="conversation-picker">
    <label for="conversations">聊天</label>
    <select id="conversations" disabled></select>
    <button type="button" id="new-conversation" disabled>新对话</button>
  </div>
  <section id="history" aria-label="对话历史"></section>
  <form id="chat">
    <label for="message">消息</label>
    <textarea id="message" maxlength="2000" rows="3" required></textarea>
    <label><input type="checkbox" id="wiki" disabled>允许本轮查询已装配的 Wiki 导出</label>
    <label id="note-label" hidden><input type="checkbox" id="allow-note">允许本轮保存一份本地工作笔记</label>
    <button type="submit" disabled>发送</button>
  </form>
  <p id="feedback" role="status"></p>
</main>
</body>
</html>
