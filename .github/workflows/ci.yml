# Catalyst Platform Minimum Operational V1 release gate
name: catalyst-platform-ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record tested identity
        shell: bash
        run: |
          mkdir -p audit_artifacts
          git rev-parse HEAD | tee audit_artifacts/tested_sha.txt
          git rev-parse HEAD^{tree} | tee audit_artifacts/tested_tree.txt

      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q agent_runtime platform_standard enterprise_extensions examples tests 2>&1 | tee audit_artifacts/compile.log

      - name: Minimal loop
        shell: bash
        run: |
          set -o pipefail
          python -m examples.run_minimal_loop 2>&1 | tee audit_artifacts/minimal_loop.log

      - name: Run all offline test modules
        shell: bash
        run: |
          set -euo pipefail
          : > audit_artifacts/regression.log
          while IFS= read -r f; do
            mod="${f%.py}"
            mod="${mod//\//.}"
            echo "=== $mod ===" | tee -a audit_artifacts/regression.log
            python -m "$mod" 2>&1 | tee -a audit_artifacts/regression.log
          done < <(find examples -maxdepth 1 -type f -name 'test_*.py' | sort)

      - name: Run Platform Standard tests (PS-1..PS-14 + AR-1..AR-7)
        shell: bash
        run: |
          set -o pipefail
          python tests/test_platform_standard_core.py 2>&1 | tee audit_artifacts/platform_standard.log

      - name: Run Capability Contract Conformance Pilot tests (CC)
        shell: bash
        run: |
          set -o pipefail
          python tests/test_capability_contract_conformance_pilot.py 2>&1 | tee audit_artifacts/capability_contract_conformance.log

      - name: Run Enterprise Extension tests (EE-1..EE-12)
        shell: bash
        run: |
          set -o pipefail
          python tests/test_enterprise_extension_pilot.py 2>&1 | tee audit_artifacts/enterprise_extension.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-platform-ci-evidence
          path: audit_artifacts/
          if-no-files-found: error
