  command_timeout_seconds: 60
  max_model_attempts: 6
  max_repair_cycles: 1
  task_environment:
    CATALYST_TRIAL_BASE_SHA: EXACT_AUTHORIZATION_COMMIT
  task_environment_secret_names_forbidden: true

model_task:
  task_id: case01-knowledge-hash-hardening
  instruction: >-
    Harden the BREA v0.8 Case-local Knowledge Revision binding identity in the
    single authorized knowledge.py file. Replace raw JSON-file-byte identity with
    a deterministic canonical Knowledge Revision SHA. Preserve all knowledge-bearing
    content in identity except sources[].local_reference, which is machine-local
    execution location only. Stable identity is required across indentation,
    object-key order, JSON line endings, and local_reference-only changes. Source
    SHA, route, fact, schema, authority and other knowledge-bearing changes must
    change identity. Malformed JSON, identity mismatch, non-standard JSON numeric
    values such as NaN/Infinity, and hash mismatch must fail closed. Do not weaken
    independent sources[].sha256 corpus verification. Do not modify any other file.
    Use the supplied deterministic verifier; do not claim completion without PASS.

preflight_requirements:
  status: READY
  credential_source_type: USER_LOCAL
  workspace_identity_must_match_trial_worktree: true
  executable_python_available: true
  failure_action: STOP_NO_PRODUCT_COMMIT

required_verification_contract:
  H-01: indentation_identity_stable
  H-02: object_key_order_identity_stable
  H-03: json_line_endings_identity_stable
  H-04: local_reference_only_identity_stable
  H-05: source_sha_changes_identity
  H-06: route_or_fact_change_changes_identity
  H-07: canonical_binding_accepts_equivalent_revision
  H-08: wrong_expected_canonical_sha_fails_closed
  H-09: malformed_identity_mismatch_nonstandard_numbers_fail_closed
  H-10: source_content_sha_integrity_remains_independent
  H-11: only_knowledge_py_candidate_diff_and_representative_v08_behavior_preserved

persistent_mutation_boundary:
  authorized_product_file:
    - case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/candidate/brea-v0.8/brea/knowledge.py
  authorized_post_run_evidence_files:
    - case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/harness-trial-01/TRIAL_01_RESULTS.json
    - case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/harness-trial-01/TRIAL_01_REVIEW.md
  all_other_product_or_governance_files: READ_ONLY

transient_runtime_mutation_policy:
  distinction: >-
    Runtime-created temporary files/directories used by the frozen verifier are
    allowed only outside tracked repository state or must be fully removed/restored
    before commit. Persistent git changes remain governed by persistent_mutation_boundary.
  tracked_unrelated_file_mutation: FORBIDDEN

forbidden:
  - mutate KR-001.json
  - mutate KR-002.json
  - mutate KR-003.json
  - mutate corpus.py
  - mutate runner.py
  - mutate professional.py
  - mutate semantic.py
  - mutate facts.py
  - mutate any existing v0.8 test
  - mutate prior candidate trees
  - mutate historical freeze/results/review evidence
  - create v0.9
  - perform E2-C
  - admission
  - binding
  - Platform promotion
  - Platform Standard mutation
  - Runtime mutation
  - RuntimeAdapter mutation
  - main mutation
  - Harness implementation mutation
  - merge or copy Harness into Case01
  - new professional capability
  - new Knowledge schema
  - new source/corpus

required_post_run_evidence:
  results_json_must_record:
    - exact authorization commit
    - exact executor implementation commit
    - target trial branch and target workspace identity
    - preflight public result
    - credential source type without credential value
    - model provider and model id
    - model attempts
    - repair cycles
    - governance_authority false
    - model-visible read/write boundaries
    - Harness trace sufficient to prove authorized read/write/verification sequence
    - deterministic verifier exit status
    - H-01 through H-11 statuses
    - representative v0.8 positive and fail-closed regression status
    - T-C01 / T-C02 / T-C03 regression status
    - persistent git changed-file set
    - main unchanged observation
    - case-01 unchanged observation after trial branch creation
  review_md_must_state:
    - KNOWLEDGE_HASH_HARDENING_PROOF verdict
    - HARNESS_PRACTICAL_USE_PROOF verdict
    - integrated Trial verdict
    - limits and non-claims

commit_policy:
  trial_branch_execution_commits: 1
  required_commit_contents:
    - authorized knowledge.py repair candidate
    - TRIAL_01_RESULTS.json
    - TRIAL_01_REVIEW.md
  no_other_persistent_files: true
  push_trial_branch: true
  do_not_merge: true
  stop_after_push: true

valid_verdicts:
  - CASE01_HARNESS_TRIAL_01_PASS
  - CASE01_HARNESS_TRIAL_01_TARGETED_REPAIR
  - CASE01_HARNESS_TRIAL_01_FAIL

pass_requires:
  knowledge_hash_hardening_proof: PASS
  harness_practical_use_proof: PASS
  verifier: PASS
  representative_v08_behavior: PASS
  T-C01_T-C02_T-C03_regression: PASS
  persistent_changed_files_exactly_authorized: true
  main_unchanged: true
  case_01_branch_unchanged_after_trial_branch_creation: true

pass_does_not_authorize:
  - merge_or_cherry_pick_into_case-01
  - v0.9
  - E2_close
  - admission
  - binding
  - Platform_integration
  - Platform_wide_canonical_JSON
  - additional_Harness_features

stop_conditions:
  - preflight_not_READY
  - USER_LOCAL_credential_unavailable
  - frozen_Harness_executor_cannot_operate_external_target_worktree
  - deterministic_verifier_invalid_or_not_runnable
  - repair_requires_more_than_knowledge.py
  - more_than_one_repair_cycle_required
  - source_integrity_would_be_weakened
  - professional_behavior_regression
  - any_forbidden_persistent_mutation_required

final_instruction: >-
  Execute exactly one bounded Harness Trial only after confirming this authorization
  commit is the base of the trial branch. If any stop condition occurs, stop and
  report without widening scope. A PASS is evidence for this Trial only and carries
  no merge, admission, binding, Platform, Runtime, or further implementation authority.
