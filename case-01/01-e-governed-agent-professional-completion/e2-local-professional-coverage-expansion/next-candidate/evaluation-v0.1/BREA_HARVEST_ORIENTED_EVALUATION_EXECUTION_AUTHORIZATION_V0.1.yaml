v0_1_evaluation_principles:
  - responsibility first: evaluate PR-01..PR-18 under their existing identities
  - evidence before score: preserve outputs, evidence, gates and attribution; no single Agent score
  - deterministic where possible: BREA is deterministic; do not add an LLM judge
  - outcome and source fidelity over preferred internal path
  - benchmark defect / environment failure are not Agent failure
  - execution machinery is replaceable and must not own Catalyst meaning
  - evaluation output must support Harvest / Reuse / Repair decisions

external_method_borrowing_without_hard_dependency:
  inspect_style:
    - frozen Task/Sample identity
    - public input separated from private scorer/oracle
    - isolated reproducible execution
    - structured evaluation log
  anthropic_style:
    - distinguish task/trial/grader/evaluation-infrastructure failure
    - code grader for deterministic behavior
    - inspect outcome and trajectory evidence where useful
  langsmith_style:
    - preserve run evidence so later real-use failures can become regressions
  openai_testing_style:
    - verify behavior at the responsibility boundary
    - do not use test doubles to claim model/network behavior not actually exercised
  rule: >-
    These are method principles only. Do not install Inspect AI, LangSmith, OpenAI SDK,
    or any new evaluation framework solely for this Case01 execution unless the current
    benchmark cannot be executed correctly without it. A stdlib/local deterministic
    runner is preferred for V0.1.

required_execution:
  regression_floor:
    working_directory: case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/candidate/brea-v0.9
    commands:
      - python tests/run_all.py
      - python tests/test_v07_source_structure.py
      - python tests/test_v08_residential_slice.py
      - python tests/test_v09_knowledge_identity.py
  frozen_benchmark:
    execute_all_5_cases: true
    target_receives_only_public_case_material: true
    private_rubric_hidden_from_target: true
    deterministic_grading: true
    critical_gates_must_be_reported: true

minimal_runner:
  path: case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/evaluation-v0.1/run_evaluation.py
  may_be_created: true
  requirements:
    - stdlib-first; no new dependency unless strictly required
    - load exact frozen public/private benchmark files
    - verify frozen benchmark hashes before run
    - verify target identity / knowledge revision before run when observable
    - run target through its real product entry path, not a synthetic reimplementation
    - preserve raw observable result per case
    - deterministic scorer uses frozen private rubric/oracle
    - never modify target Candidate or Knowledge
    - classify infrastructure failure separately from Agent failure
    - exit nonzero only for invalid evaluation execution/infrastructure, not merely because an Agent case fails

required_results:
  path: case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/evaluation-v0.1/results.json
  must_include:
    - authorization_commit
    - target_identity
    - knowledge_revision_identity
    - benchmark_hashes
    - regression_command_results
    - per_case_input_identity
    - per_case_raw_output_or_structured_result
    - per_case_deterministic_checks
    - per_case_pass_fail_blocked
    - critical_gate_results
    - failure_attribution_for_each_material_failure
    - evaluation_validity
    - responsibility_evidence_update_for_PR_01_through_PR_18
    - harvest_findings
  harvest_findings_rule: >-
    Harvest findings must reference existing PR/FN/SEAM/OBL/mechanism identities wherever
    possible. They may propose a PROVISIONAL capability candidate only when the run adds
    independent evidence that a stable reusable boundary exists. Do not create a new
    Capability Registry entry, Platform object, or new formal capability identity in this Stage.
  harvest_finding_fields:
    - identity_or_provisional_label
    - evidence_case_ids
    - what_is_proven
    - what_is_not_proven
    - known_boundary
    - reuse_value
    - recommendation
  harvest_recommendations:
    - HARVEST_CANDIDATE
    - KEEP_CASE_LOCAL
    - DO_NOT_HARVEST_YET
    - NOT_RELEVANT

required_primary_report:
  path: case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/evaluation-v0.1/PRODUCT_CAPABILITY_EVALUATION_REPORT.md
  purpose: >-
    One concise decision report. Do not create separate gap-analysis, score report,
    benchmark report, failure report, or harvest report.
  must_answer:
    - Is the evaluation itself valid?
    - Which REQUIRED responsibilities are now PROVEN / PARTIAL / MISSING?
    - Did any critical gate fail?
    - If something failed, what is the primary attribution?
    - What, if anything, is now credible as a Harvest candidate?
    - What remains explicitly unproven?
    - Is machine evidence sufficient to proceed to Human Product / Professional Review?
    - If not, what is the single next material gap?

no_single_score:
  enabled: true
  rule: >-
    Do not collapse BREA into a single percentage or composite score. Case-level results,
    critical gates, responsibility evidence, and harvest findings are authoritative.

human_review:
  execution_in_this_authorization: FORBIDDEN
  machine_stage_may_only_conclude:
    - MACHINE_EVALUATION_SUPPORTS_READY_FOR_HUMAN_REVIEW
    - PRODUCT_CRITICAL_GAP_REMAINS
    - EVALUATION_NOT_YET_VALID

