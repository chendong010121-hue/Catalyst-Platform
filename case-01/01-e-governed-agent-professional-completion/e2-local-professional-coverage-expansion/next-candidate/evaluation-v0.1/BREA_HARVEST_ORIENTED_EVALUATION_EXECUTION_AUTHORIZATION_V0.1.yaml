  - modify BREA v0.9 Candidate
  - modify KR-001 / KR-002 / KR-003 or source files
  - add new professional facts/routes/sources
  - repair BREA in the same execution
  - add LLM judge
  - create Eval Service / Eval Registry / Benchmark Service / Harvest Service
  - install external eval framework without demonstrated necessity
  - modify Platform / Runtime / RuntimeAdapter / platform-harness
  - modify or rebase onto current remote main
  - start E2-C / Admission / Binding
  - execute Waku evaluation

