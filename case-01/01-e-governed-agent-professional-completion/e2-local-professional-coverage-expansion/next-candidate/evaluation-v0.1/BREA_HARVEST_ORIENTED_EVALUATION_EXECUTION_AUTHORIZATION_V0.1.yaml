  - PRODUCT_CRITICAL_GAP_REMAINS
  - EVALUATION_NOT_YET_VALID

pass_requires:
  - all four inherited regression commands executed and recorded
  - all five frozen benchmark cases executed exactly once through real product path
  - frozen benchmark hashes verified before execution
  - no target-visible leakage of private rubric
  - every critical gate explicitly reported
  - every material failure attributed or marked unresolved
  - results.json includes harvest findings and explicit unproven boundaries
  - one primary report only
  - Candidate/Knowledge/Platform/Runtime/Harness protected
  - exactly one execution commit

stop_conditions:
  - benchmark hash mismatch
  - target identity mismatch
  - Knowledge Revision mismatch
  - evaluation cannot use the real BREA product entry path
  - private rubric would need to be shown to BREA
  - evaluation infrastructure cannot distinguish its own failure from Agent failure
  - any benchmark defect is discovered that could materially change a verdict
  - more than one implementation/execution commit appears necessary

final_instruction: >-
  Execute the frozen BREA v0.9 evaluation once. Use the minimum deterministic runner
  needed, preserve evidence and attribution, produce harvest-oriented findings rather
  than a single score, create exactly one execution commit, push case-01, and STOP.
  Do not repair BREA and do not build new evaluation infrastructure.
