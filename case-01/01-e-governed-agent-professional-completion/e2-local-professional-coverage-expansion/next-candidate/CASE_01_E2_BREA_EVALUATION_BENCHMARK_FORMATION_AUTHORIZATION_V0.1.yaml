    - responsibility_map_sha256
    - public_benchmark_sha256
    - private_rubric_sha256
    - case_ids
    - suite_per_case
    - PR_ids_per_case
    - case_count
    - critical_gates_covered
    - benchmark_design_limitations
    - statement_that_target_was_not_executed_against_new_benchmark

forbidden_actions:
  - execute BREA against any newly created benchmark case
  - modify candidate/brea-v0.9/**
  - modify KR-001.json
  - modify KR-002.json
  - modify KR-003.json
  - add LLM dependency to BREA or benchmark merely for grading
  - create web fallback
  - create new professional route/fact/source
  - create E2-C implementation
  - begin Admission or Binding
  - modify Platform Standard
  - modify Runtime or RuntimeAdapter
  - modify platform-harness
  - modify main
  - create a feature roadmap
  - create a second capability/evaluation ontology

allowed_persistent_files:
  - case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/evaluation-v0.1/responsibility_map.json
  - case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/evaluation-v0.1/benchmark/**
  - case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/evaluation-v0.1/run_evaluation.py
  - case-01/01-e-governed-agent-professional-completion/e2-local-professional-coverage-expansion/next-candidate/evaluation-v0.1/BENCHMARK_FREEZE_RECORD.json

commit_policy:
  commits: 1
  commit_message: "case-01: freeze BREA product evaluation benchmark v0.1"
  push_branch: case-01
  merge: FORBIDDEN
  pull_request: FORBIDDEN
  stop_after_push: true

valid_final_verdicts:
  - BREA_EVAL_BENCHMARK_FROZEN_FOR_REVIEW
  - BREA_EVAL_BENCHMARK_TARGETED_REPAIR
  - BREA_EVAL_BENCHMARK_INVALID

pass_requires:
  - responsibility_map_completed_before_case_design
  - every new case traces to REQUIRED plus insufficiently proven responsibility
  - public/private separation present
  - critical gates represented fairly
  - no ideal-agent feature wishlist encoded as required capability
  - new benchmark not executed against BREA
  - frozen target unchanged
  - protected paths unchanged
  - exactly one benchmark-formation commit

stop_conditions:
  - product scope must be redefined to design the benchmark
  - a required gold answer is not supported by current authoritative evidence
  - benchmark design requires modifying BREA
  - benchmark design requires modifying Knowledge Revision
  - evaluation runner would need Platform/Runtime/Harness changes
  - more than one commit appears necessary

final_instruction: >-
  Form and freeze the minimum fair BREA v0.9 product evaluation benchmark from
  existing Case01 evidence and the accepted responsibility map. Do not execute
  the target Agent against the new cases. Create exactly one benchmark-formation
  commit, push case-01, and STOP for external benchmark review before evaluation.
